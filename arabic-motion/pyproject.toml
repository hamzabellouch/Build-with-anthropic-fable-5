[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khattat"
version = "1.0.0"
description = "خطّاط — turn Arabic sentences into hand-calligraphy videos: a virtual calligrapher writes the rasm, returns for the dots, then places the tashkil."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Khattat" }]
keywords = ["arabic", "calligraphy", "animation", "video", "handwriting", "tashkil", "harfbuzz"]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "uharfbuzz>=0.39",
    "freetype-py>=2.4",
    "scipy>=1.11",
]

[project.scripts]
khattat = "khattat.cli:main"

[tool.setuptools]
packages = ["khattat"]
